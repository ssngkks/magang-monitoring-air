; ============================================================
;  TANDON MONITORING - PlatformIO Project
;  1 project, 2 firmware (environment):
;    - node_sensor -> ESP32 #1, baca semua sensor fisik, kirim via LoRa (Tanpa AI)
;    - gateway     -> ESP32 #2, terima LoRa, inferensi Edge AI, kirim ke WiFi/Firebase/Telegram
; ============================================================
; MODE BUILD (blueprint susulan simplify-crypto, fase prototipe LAN):
; - Default (node_sensor, gateway): fitur berat MATI — OTA hanya SHA256/CRC16,
;   TLS pakai setInsecure() sadar-LAN, LoRa plain tanpa HMAC. Binary kecil.
; - Secure (node_sensor_secure, gateway_secure): semua fitur NYALA
;   (FEATURE_OTA_SIGNING + FEATURE_TLS_PINNING + FEATURE_LORA_AUTH).
;   rweather/Crypto HANYA di-link di env _secure supaya binary default
;   benar-benar tidak membawa kode Ed25519 (bukan sekadar `if` mati).
; Matriks kompatibilitas: default<->default OK, secure<->secure OK,
; campur (node plain + gateway strict) HANYA untuk migrasi sementara —
; gateway strict menolak paket plain dengan log [AUTH-MISMATCH] yang beda
; dari peringatan "node tidak terdengar" (lihat src/gateway/main.cpp).
; Fitur murah SELALU aktif di semua env: token unik per-device (NVS),
; auth endpoint OTA (verify.node.token), string bersih.
; ============================================================

[platformio]
default_envs = node_sensor, gateway

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Iinclude

[env:node_sensor]
build_src_filter = +<node/*>
build_flags =
    ${env.build_flags}
    -D DEVICE_ROLE_NODE
    -D LORA_STRICT_AUTH=0
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    adafruit/DHT sensor library @ ^1.4.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9
lib_ignore =
    FirebaseClient
    TelegramNotifier
    OtaUpdater
    WaterQualityAI
    FirmwareVerify

[env:gateway]
build_src_filter = +<gateway/*>
build_flags =
    ${env.build_flags}
    -D DEVICE_ROLE_GATEWAY
    -D CURRENT_FW_VERSION=\"v1.0.8\"
    -D LORA_STRICT_AUTH=0
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
lib_ignore =
    Sensors
    SensorCore
    FirmwareVerify

[env:node_sensor_secure]
extends = env:node_sensor
build_flags =
    ${env.build_flags}
    -D DEVICE_ROLE_NODE
    -D LORA_STRICT_AUTH=0
    -D FEATURE_OTA_SIGNING=1
    -D FEATURE_TLS_PINNING=1
    -D FEATURE_LORA_AUTH=1
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    adafruit/DHT sensor library @ ^1.4.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    rweather/Crypto @ ^0.4.0
lib_ignore =
    FirebaseClient
    TelegramNotifier
    OtaUpdater
    WaterQualityAI

[env:gateway_secure]
extends = env:gateway
build_flags =
    ${env.build_flags}
    -D DEVICE_ROLE_GATEWAY
    -D CURRENT_FW_VERSION=\"v1.0.8\"
    -D LORA_STRICT_AUTH=0
    -D FEATURE_OTA_SIGNING=1
    -D FEATURE_TLS_PINNING=1
    -D FEATURE_LORA_AUTH=1
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    rweather/Crypto @ ^0.4.0
lib_ignore =
    Sensors
    SensorCore
